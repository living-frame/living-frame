<style>
:root{ --ink:#17111f; --ink2:#241b31; --gold:#d6a22e; --bone:#f4efe4; --green:#79b627; --blue:#1d86c9; }
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--ink);
  font-family:"Assistant",system-ui,sans-serif;color:var(--bone);-webkit-tap-highlight-color:transparent}
/* מיכל אמיתי לסצנה: MindAR מודד לפיו את גודל התצוגה ותולה בו את וידאו המצלמה.
   בלי זה הוא נופל על <body> ומקבל מידות שגויות, והתמונה יוצאת חתוכה או נעלמת. */
#ar{position:fixed;inset:0;z-index:0;background:#000}
#ar a-scene{position:absolute;inset:0;width:100%;height:100%}
#ar video{z-index:0!important}
#ar .a-canvas{position:absolute!important;inset:0!important;width:100%!important;height:100%!important;
  z-index:1!important;background:transparent!important}
#hidden{display:none}

/* מסגרת סריקה — משוב חזותי כל עוד לא נעלנו על תמונה */
#scan{position:fixed;inset:0;z-index:15;pointer-events:none;display:none}
#scan.on{display:block}
#scanbox{position:absolute;top:50%;left:50%;transform:translate(-50%,-54%);
  width:60vw;max-width:330px;aspect-ratio:3/4}
#scanbox i{position:absolute;width:26px;height:26px;border:3px solid var(--gold);opacity:.85;
  animation:breathe 2.4s ease-in-out infinite}
#scanbox i:nth-child(1){top:0;right:0;border-left:0;border-bottom:0;border-radius:0 8px 0 0}
#scanbox i:nth-child(2){top:0;left:0;border-right:0;border-bottom:0;border-radius:8px 0 0 0}
#scanbox i:nth-child(3){bottom:0;right:0;border-left:0;border-top:0;border-radius:0 0 8px 0}
#scanbox i:nth-child(4){bottom:0;left:0;border-right:0;border-top:0;border-radius:0 0 0 8px}
#scanbox u{position:absolute;left:6px;right:6px;height:2px;border-radius:2px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);
  box-shadow:0 0 12px rgba(214,162,46,.8);animation:sweep 2.6s ease-in-out infinite}
@keyframes sweep{0%{top:4%;opacity:0}12%{opacity:1}88%{opacity:1}100%{top:96%;opacity:0}}
@keyframes breathe{0%,100%{opacity:.45}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){ #scanbox u{display:none} #scanbox i{animation:none} }

#diag{position:fixed;inset:auto 0 0 0;z-index:60;background:#100c17;border-top:1px solid #3b2e4a;
  padding:14px 16px calc(20px + env(safe-area-inset-bottom));display:none;
  font-family:ui-monospace,monospace;font-size:12.5px;color:#b9adc4;line-height:1.8}
#diag.on{display:block}
#diag b{color:var(--gold);font-family:"Assistant"}
#diag button{margin-top:10px;margin-inline-end:8px;background:#241b31;border:1px solid #3b2e4a;color:var(--bone);
  border-radius:9px;padding:8px 12px;font-family:"Assistant";font-size:13px}

#start{position:fixed;inset:0;z-index:50;overflow:auto;
  background:radial-gradient(120% 80% at 50% 0%, #2a1f3a 0%, var(--ink) 60%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;text-align:center}
#start img{width:112px;margin-bottom:8px}
#start h1{font-family:"Frank Ruhl Libre",serif;font-size:33px;font-weight:900;margin:0}
#start p{max-width:31ch;color:#cabfd2;font-weight:300;font-size:16px;margin:8px 0 0;line-height:1.6}
#go{margin-top:24px;background:var(--gold);color:#221703;border:0;border-radius:14px;
  padding:15px 40px;font-family:"Assistant";font-weight:800;font-size:18px}
#go[disabled]{opacity:.45}
#prefetch{margin-top:12px;background:transparent;border:1px solid #4a3a5c;color:#cabfd2;
  border-radius:12px;padding:10px 20px;font-family:"Assistant";font-size:14.5px;font-weight:600}
#err{color:#f3a273;font-size:14px;margin-top:14px;max-width:32ch;min-height:1.2em}
#count{font-size:13px;color:#8d8194;margin-top:18px}
#topline{position:absolute;top:calc(14px + env(safe-area-inset-top));left:0;right:0;text-align:center;
  font-size:12px;color:#6f6480;letter-spacing:.04em}
#credit{font-size:12.5px;color:#6f6480;margin-top:6px}
#house{font-family:"Frank Ruhl Libre",serif;font-size:15.5px;line-height:1.5;max-width:29ch;margin:14px auto 0;
  background:linear-gradient(100deg,#8d6516 0%,#d6a22e 22%,#f3dd9a 48%,#d6a22e 72%,#8d6516 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent}

#hud{position:fixed;inset:0;z-index:20;pointer-events:none;display:none}
#top{position:absolute;top:0;left:0;right:0;padding:calc(14px + env(safe-area-inset-top)) 14px 14px;
  display:flex;justify-content:space-between;gap:10px}
.btn{pointer-events:auto;background:rgba(16,11,22,.6);border:1px solid rgba(255,255,255,.18);
  color:#fff;border-radius:999px;padding:8px 14px;font-family:"Assistant";font-size:14px;font-weight:600;backdrop-filter:blur(6px)}
#state{position:absolute;left:0;right:0;bottom:calc(18px + env(safe-area-inset-bottom));padding:0 14px}
#scanmsg{text-align:center;font-size:13px;color:#efe7dd;text-shadow:0 1px 8px #000;margin-bottom:10px}
.card{pointer-events:auto;background:rgba(20,14,26,.82);border:1px solid rgba(214,162,46,.45);
  border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:10px;backdrop-filter:blur(8px)}
.dot{width:9px;height:9px;border-radius:99px;background:#6b5f77;flex:0 0 auto;transition:.2s}
.card.on .dot{background:var(--green);box-shadow:0 0 9px var(--green)}
.card.load .dot{background:var(--blue);box-shadow:0 0 9px var(--blue)}
.card b{font-family:"Frank Ruhl Libre",serif;font-size:17px;color:var(--gold);display:block;line-height:1.2}
.card small{font-size:11.5px;color:#c9bdb2;display:block}
.card .more{margin-inline-start:auto;font-size:12px;color:#9b8fa6}
#dlbar{height:3px;background:#3a2e4a;border-radius:9px;margin-top:8px;overflow:hidden;display:none}
#dlbar i{display:block;height:100%;width:0;background:var(--blue);transition:width .2s}

#sheet{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--ink2);
  border-radius:20px 20px 0 0;padding:14px 18px calc(24px + env(safe-area-inset-bottom));
  border-top:1px solid #443552;transform:translateY(110%);transition:transform .25s ease}
#sheet.open{transform:none}
#sheet .grab{width:38px;height:4px;border-radius:9px;background:#544364;margin:0 auto 12px}
#sheet h2{font-family:"Frank Ruhl Libre",serif;font-size:22px;margin:0 0 4px}
#sheet p{font-size:14.5px;color:#c3b8cb;font-weight:300;margin:3px 0;line-height:1.6}
#sheet .line{display:flex;justify-content:space-between;font-size:13px;color:#9b8fa6;
  border-top:1px solid #3b2e4a;padding-top:9px;margin-top:12px}
@media (prefers-reduced-motion:reduce){ #sheet{transition:none} }
</style>
</head>
<body>

<div id="start">
  <div id="topline">מסגרת חיה · גרסה 1.0.5</div>
  <img src="./logo-dark.png" alt="לוגו בית הכנסת">
  <h1>מסגרת חיה</h1>
  <div id="house">בית הכנסת הרומני, ע״ש הרב אברהם מתתיהו הצדיק משטפנישט — תמונות מספרות</div>
  <p>כוונו את הטלפון לתמונה על הקיר. ההנפשה תיפתח בתוך המסגרת ותישאר צמודה אליה.</p>
  <button id="go" disabled>טוען…</button>
  <button id="prefetch" style="display:none">שמירת כל ההנפשות במכשיר</button>
  <div id="err"></div>
  <div id="count"></div>
  <div id="credit">נוצר ע״י אמיר כהן</div>
</div>

<div id="hud">
  <div id="top">
    <button class="btn" id="sound">🔇 קול כבוי</button>
    <button class="btn" id="fit">מילוי מסגרת</button>
    <button class="btn" id="info">ℹ</button>
  </div>
  <div id="state">
    <div id="scanmsg">מחפש תמונה מוכרת…</div>
    <div class="card" id="card">
      <span class="dot"></span>
      <div style="min-width:0">
        <b id="ctitle">מסגרת חיה</b>
        <small id="csub">לא נעול</small>
      </div>
      <span class="more">פרטים ›</span>
    </div>
    <div id="dlbar"><i></i></div>
  </div>
</div>

<div id="sheet">
  <div class="grab"></div>
  <h2 id="stitle"></h2>
  <p id="sded"></p>
  <div class="line"><span id="sloc"></span><span id="sdate"></span></div>
</div>

<div id="scan"><div id="scanbox"><i></i><i></i><i></i><i></i><u></u></div></div>
<div id="diag"></div>
<div id="ar"></div>
<div id="hidden"></div>

<script>
const VERSION = '1.0.5';
const $ = s => document.querySelector(s);

/* ---------- מטמון קליפים במכשיר ---------- */
let db = null;
function openDB(){
  return new Promise((res) => {
    const r = indexedDB.open('living-frame-media', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('clips');
    r.onsuccess = () => res(r.result);
    r.onerror = () => res(null);
  });
}
const key = (it) => it.id + '@' + (it.rev || '0');
let cdnBase = './';
const mediaURL = (p) => /^https?:/i.test(p) ? p : (cdnBase + p);
function idbGet(k){
  return new Promise(res => {
    if (!db) return res(null);
    const q = db.transaction('clips').objectStore('clips').get(k);
    q.onsuccess = () => res(q.result || null);
    q.onerror = () => res(null);
  });
}
function idbPut(k, blob){
  return new Promise(res => {
    if (!db) return res();
    const t = db.transaction('clips', 'readwrite');
    t.objectStore('clips').put(blob, k);
    t.oncomplete = res; t.onerror = res;
  });
}
function idbKeys(){
  return new Promise(res => {
    if (!db) return res([]);
    const q = db.transaction('clips').objectStore('clips').getAllKeys();
    q.onsuccess = () => res(q.result || []); q.onerror = () => res([]);
  });
}
async function idbClean(valid){
  const ks = await idbKeys();
  const gone = ks.filter(k => !valid.includes(k));
  if (!gone.length || !db) return;
  const t = db.transaction('clips', 'readwrite');
  gone.forEach(k => t.objectStore('clips').delete(k));   // גרסאות ישנות של קליפים שהוחלפו
}

/* הורדה עם התקדמות, ואז שמירה במכשיר */
async function fetchClip(it, onProgress){
  const res = await fetch(mediaURL(it.video) + (it.rev ? '?v=' + it.rev : ''), { cache: 'no-store' });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const total = +res.headers.get('content-length') || 0;
  if (!res.body || !total) return await res.blob();
  const reader = res.body.getReader();
  const chunks = []; let got = 0;
  for (;;){
    const { done, value } = await reader.read();
    if (done) break;
    chunks.push(value); got += value.length;
    if (onProgress) onProgress(got / total);
  }
  return new Blob(chunks, { type: 'video/mp4' });
}

const ready = {};
async function ensureClip(i, onProgress){
  if (ready[i]) return true;
  const it = items[i], k = key(it);
  let blob = await idbGet(k);
  if (!blob){
    blob = await fetchClip(it, onProgress);
    await idbPut(k, blob);
  }
  vid(i).src = URL.createObjectURL(blob);
  ready[i] = true;
  return false;   // false = לא היה שמור, כלומר הורד עכשיו
}

/* ---------- התאמת הווידאו למסגרת ---------- */
AFRAME.registerComponent('fit-video', {
  schema: { vid: {type:'string'}, ratio: {type:'number', default:1} },
  init(){ this.done = false; },
  tick(){
    if (this.done) return;
    const mesh = this.el.getObject3D('mesh');
    const v = document.querySelector(this.data.vid);
    if (!mesh || !mesh.material || !mesh.material.map || !v || !v.videoWidth) return;
    const map = mesh.material.map;
    const planeAspect = 1 / this.data.ratio, videoAspect = v.videoWidth / v.videoHeight;
    if (window.FIT_MODE === 'stretch'){ map.repeat.set(1,1); map.offset.set(0,0); }
    else if (videoAspect > planeAspect){ const r = planeAspect/videoAspect; map.repeat.set(r,1); map.offset.set((1-r)/2,0); }
    else { const r = videoAspect/planeAspect; map.repeat.set(1,r); map.offset.set(0,(1-r)/2); }
    map.needsUpdate = true; this.done = true;
  },
  refresh(){ this.done = false; }
});
window.FIT_MODE = 'cover';

/* ---------- טעינה ---------- */
const FALLBACK = { rev: '0', items: [{ id:'lion', rev:'0', title:'יהודה', location:'אולם ראשי',
  date:'כ׳ אדר תשע״ג', dedication:'הוקדש לעילוי נשמת שמעון שמש בן רחל ויוסף ז״ל',
  image:'media/lion.jpg', video:'media/lion.mp4', w:914, h:1280 }]};

let items = [], scene = null, manifestRev = '0', maxTrack = 2;
const active = new Set();          // כל התמונות שנעולות ברגע זה
let lastFound = -1, foundCount = 0, arState = 'לא הופעל';

let frames = 0, fps = 0;
setInterval(() => { fps = frames; frames = 0; }, 1000);
(function tick(){ frames++; requestAnimationFrame(tick); })();
const vid = (i) => document.querySelector('#v' + i);

(async function boot(){
  db = await openDB();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});

  try {
    const m = await (await fetch('./manifest.json', { cache: 'no-store' })).json();
    items = m.items; manifestRev = m.rev || m.updated || '0';
    if (m.cdn) cdnBase = m.cdn.endsWith('/') ? m.cdn : m.cdn + '/';
    if (m.maxTrack) maxTrack = m.maxTrack;
  } catch (e) { items = FALLBACK.items; }

  await idbClean(items.map(key));

  const hidden = $('#hidden');
  items.forEach((it, i) => {
    const v = document.createElement('video');
    v.id = 'v' + i; v.loop = true; v.muted = true; v.preload = 'none';
    v.setAttribute('playsinline',''); v.setAttribute('webkit-playsinline','');
    hidden.appendChild(v);            // בלי src — הקובץ יורד רק כשהתמונה מזוהה
  });

  const targets = items.map((it, i) => {
    const ratio = (it.h / it.w).toFixed(4);
    return `<a-entity class="target" data-i="${i}" mindar-image-target="targetIndex: ${i}">
      <a-video src="#v${i}" width="1" height="${ratio}" position="0 0 0"
               fit-video="vid: #v${i}; ratio: ${ratio}"></a-video></a-entity>`;
  }).join('');

  $('#ar').insertAdjacentHTML('beforeend',
    `<a-scene id="scene"
      mindar-image="imageTargetSrc: ./targets.mind?v=${encodeURIComponent(manifestRev)}; autoStart: false;
                    uiScanning: no; uiLoading: no; uiError: no; maxTrack: ${maxTrack};
                    warmupTolerance: 1; missTolerance: 6; filterMinCF: 0.0005; filterBeta: 500"
      color-space="sRGB" embedded renderer="colorManagement: true, precision: medium"
      vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      <a-camera position="0 0 0" look-controls="enabled: false" cursor="fuse: false"></a-camera>
      ${targets}
    </a-scene>`);

  scene = $('#scene');
  scene.addEventListener('arReady', () => { arState = 'פעיל'; });
  scene.addEventListener('arError', (e) => { arState = 'שגיאה: ' + ((e.detail && e.detail.error) || '?'); });
  maxTrack = Math.max(1, Math.min(maxTrack, items.length));
  document.querySelectorAll('.target').forEach(el => {
    const i = +el.dataset.i;
    el.addEventListener('targetFound', () => onFound(i));
    el.addEventListener('targetLost',  () => onLost(i));
  });

  const savedKeys = await idbKeys();
  const savedCount = items.filter(it => savedKeys.includes(key(it))).length;
  $('#count').textContent = `${items.length} תמונות במאגר · ${savedCount} הנפשות כבר שמורות במכשיר`;
  if (savedCount < items.length) $('#prefetch').style.display = 'inline-block';
  $('#go').disabled = false;
  $('#go').textContent = 'פתיחת המצלמה';
})();

/* ---------- מעקב ---------- */
function paintCard(){
  const list = [...active];
  if (!list.length) return;
  $('#card').classList.add('on');
  $('#ctitle').textContent = list.length === 1
    ? (items[list[0]].title || 'תמונה ' + (list[0]+1))
    : list.map(i => items[i].title).join(' · ');
}

async function onFound(i){
  active.add(i); lastFound = i; foundCount++;
  paintCard();
  $('#scan').classList.remove('on');
  $('#scanmsg').style.display = 'none';

  if (!ready[i]){
    $('#card').classList.add('load');
    $('#csub').textContent = 'מוריד את ההנפשה של ' + (items[i].title || '') + '…';
    $('#dlbar').style.display = 'block';
    try {
      await ensureClip(i, p => $('#dlbar i').style.width = (p*100).toFixed(0) + '%');
    } catch (e) {
      $('#csub').textContent = 'ההנפשה לא נטענה. יש חיבור לאינטרנט?';
      vid(i).src = mediaURL(items[i].video);   // ניסיון אחרון: ניגון ישיר מהרשת
    }
    $('#dlbar').style.display = 'none';
    $('#card').classList.remove('load');
  }
  if (active.has(i)) vid(i).play().catch(()=>{});   // ייתכן שהתמונה יצאה בזמן ההורדה
}

function onLost(i){
  active.delete(i);
  vid(i).pause();
  if (active.size === 0){
    $('#card').classList.remove('on');
    $('#scan').classList.add('on');
    $('#scanmsg').style.display = 'block';
    $('#scanmsg').textContent = 'התמונה יצאה מהפריים';
    $('#csub').textContent = 'מושהה · ' + vid(i).currentTime.toFixed(1) + ' שניות';
  } else paintCard();
}

setInterval(() => {
  const list = [...active].filter(i => ready[i]);
  if (!list.length) return;
  if (list.length === 1){
    const v = vid(list[0]);
    $('#csub').textContent = 'מנגן · ' + v.currentTime.toFixed(1) + ' מתוך ' +
      (v.duration ? v.duration.toFixed(1) : '—') + ' שניות';
  } else {
    $('#csub').textContent = list.length + ' הנפשות פועלות במקביל';
  }
}, 250);

/* ---------- כפתורים ---------- */
$('#go').addEventListener('click', async () => {
  const btn = $('#go');
  $('#err').textContent = '';
  btn.disabled = true; btn.textContent = 'מפעיל…';
  try {
    // פתיחת ניגון וידאו בתוך מחוות המשתמש — רק אם כבר יש קובץ טעון,
    // אחרת play() על וידאו בלי מקור נשאר תלוי ולא חוזר לעולם.
    const v0 = vid(0);
    if (v0 && v0.src){
      await Promise.race([ v0.play().catch(()=>{}), new Promise(r => setTimeout(r, 400)) ]);
      v0.pause(); v0.currentTime = 0;
    }
    $('#start').style.display = 'none';
    $('#hud').style.display = 'block';
    $('#scan').classList.add('on');
    await scene.systems['mindar-image-system'].start();
    bumpResize();                      // מדידה מחדש אחרי שהפריסה התייצבה
  } catch (e) {
    $('#start').style.display = 'flex';
    $('#hud').style.display = 'none';
    $('#err').textContent = 'המצלמה לא נפתחה. צריך כתובת מאובטחת (https) ואישור גישה למצלמה. ' + (e && e.message ? e.message : '');
  }
  btn.disabled = false; btn.textContent = 'פתיחת המצלמה';
});

function bumpResize(){
  [120, 500, 1200].forEach(t => setTimeout(() => window.dispatchEvent(new Event('resize')), t));
}
window.addEventListener('orientationchange', bumpResize);

$('#prefetch').addEventListener('click', async (e) => {
  const btn = e.target; btn.disabled = true;
  for (let i = 0; i < items.length; i++){
    btn.textContent = `שומר ${i+1} מתוך ${items.length}…`;
    try { await ensureClip(i, p => btn.textContent = `שומר ${i+1} מתוך ${items.length} · ${(p*100).toFixed(0)}%`); }
    catch (err) { btn.textContent = 'ההורדה נכשלה. אפשר לנסות שוב מאוחר יותר.'; btn.disabled = false; return; }
  }
  btn.textContent = 'הכול שמור במכשיר';
  $('#count').textContent = `${items.length} תמונות במאגר · ${items.length} הנפשות שמורות במכשיר`;
});

$('#sound').addEventListener('click', (e) => {
  const on = items.some((_, i) => !vid(i).muted);
  items.forEach((_, i) => vid(i).muted = on);
  e.target.textContent = on ? '🔇 קול כבוי' : '🔊 קול פועל';
  if (!on) active.forEach(i => vid(i).play().catch(()=>{}));
});

$('#fit').addEventListener('click', (e) => {
  window.FIT_MODE = window.FIT_MODE === 'cover' ? 'stretch' : 'cover';
  e.target.textContent = window.FIT_MODE === 'cover' ? 'מילוי מסגרת' : 'מתיחה מלאה';
  document.querySelectorAll('[fit-video]').forEach(el => el.components['fit-video'].refresh());
});

$('#info').addEventListener('click', () => {
  const d = $('#diag');
  if (d.classList.contains('on')){ d.classList.remove('on'); return; }
  const sys = scene && scene.systems['mindar-image-system'];
  const v = sys && sys.video;
  const savedList = Object.keys(ready).length;
  d.innerHTML =
    `<b>גרסה</b> ${VERSION}<br>` +
    `<b>מטרות במאגר</b> ${items.length} · מהדורה ${manifestRev}<br>` +
    `<b>מצב מעקב</b> ${arState}<br>` +
    `<b>מצלמה</b> ${v && v.videoWidth ? v.videoWidth + '×' + v.videoHeight : 'לא זמין'}<br>` +
    `<b>מעקב מקביל</b> עד ${maxTrack} תמונות · פעילות עכשיו ${active.size}<br>` +
    `<b>קצב פריימים</b> ${fps}<br>` +
    `<b>נעילות מתחילת הריצה</b> ${foundCount}<br>` +
    `<b>קליפים טעונים</b> ${savedList} מתוך ${items.length}<br>` +
    `<b>שמות</b> ${items.map(i => i.title).join(' · ')}<br>` +
    `<button id="wipe">ניקוי מטמון ורענון</button><button id="closeDiag">סגירה</button>`;
  d.classList.add('on');
  d.querySelector('#closeDiag').onclick = () => d.classList.remove('on');
  d.querySelector('#wipe').onclick = async () => {
    try {
      if ('serviceWorker' in navigator){
        const rs = await navigator.serviceWorker.getRegistrations();
        await Promise.all(rs.map(r => r.unregister()));
      }
      if (window.caches){ const ks = await caches.keys(); await Promise.all(ks.map(k => caches.delete(k))); }
      indexedDB.deleteDatabase('living-frame-media');
    } catch (err) {}
    location.replace(location.pathname + '?v=' + Date.now());
  };
});

$('#card').addEventListener('click', () => {
  if (lastFound < 0 || !active.has(lastFound)) return;
  const it = items[lastFound];
  $('#stitle').textContent = it.title || '';
  $('#sded').textContent = it.dedication || '';
  $('#sloc').textContent = it.location || '';
  $('#sdate').textContent = it.date || '';
  $('#sheet').classList.add('open');
});
$('#sheet').addEventListener('click', () => $('#sheet').classList.remove('open'));
</script>
</body>
</html>
